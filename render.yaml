services:
  - type: web
    name: wildguard-ai
    runtime: python
    plan: standard
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt && python backend/download_detector.py
    startCommand: python -m uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://wildguard-ai-frontend.vercel.app
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
