services:
  - type: web
    name: wildguard-ai
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-light.txt
    startCommand: python -m uvicorn light_app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
