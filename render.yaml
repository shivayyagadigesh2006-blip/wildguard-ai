services:
  - type: web
    name: wildguard-ai
    runtime: python
    plan: starter
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python download_detector.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
